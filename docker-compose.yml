services:
  bot:
    build: .
    image: video-downloader-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot-data:/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Optional local Bot API server: raises the upload limit from 50 MB to 2000 MB.
  # Enable with COMPOSE_PROFILES=local-api and BOT_API_URL in .env (see README).
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: [local-api]
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  bot-data:
  bot-api-data:
